[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ctx-codebase"
version = "2.8.8.0"
description = "Auto-updating codebase context engine — index, summarize, export, and guard your codebase"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-rust>=0.23",
    "click>=8.1",
    "anthropic>=0.40",
    "mcp>=1.0",
    "watchdog>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
dotenv = ["python-dotenv>=1.0"]

[project.urls]
Homepage = "https://github.com/sidharthrajaram/ctx"
Repository = "https://github.com/sidharthrajaram/ctx"
Documentation = "https://github.com/sidharthrajaram/ctx"

[project.scripts]
ctx = "ctx_engine.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ctx_engine"]

